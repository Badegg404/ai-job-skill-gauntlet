name: Build Release

# 推送 tag（如 v1.0.0）时自动构建 macOS / Windows / Linux 三平台产物
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # 也可手动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: AI岗位能力试炼-macos
            asset_pattern: "dist/AI岗位能力试炼.app/**"
          - os: windows-latest
            artifact: AI岗位能力试炼-windows
            asset_pattern: "dist/AI岗位能力试炼.exe"
          - os: ubuntu-latest
            artifact: AI岗位能力试炼-linux
            asset_pattern: "dist/AI岗位能力试炼"

    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PyInstaller
        run: pip install pyinstaller

      - name: 打包（build.spec 按平台分支：macOS→.app / Windows→.exe / Linux→单文件）
        run: pyinstaller --clean --noconfirm build.spec

      - name: 打包为 zip（用 Python 统一处理，跨平台一致）
        shell: bash
        run: |
          python - <<'PY'
          import os, sys, zipfile
          artifact = "${{ matrix.artifact }}"
          target = "AI岗位能力试炼.app" if sys.platform == "darwin" else ("AI岗位能力试炼.exe" if sys.platform == "win32" else "AI岗位能力试炼")
          src = os.path.join("dist", target)
          zpath = artifact + ".zip"
          if os.path.isdir(src):
              with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(src):
                      for f in files:
                          p = os.path.join(root, f)
                          z.write(p, os.path.relpath(p, "dist"))
          else:
              with zipfile.ZipFile(zpath, "w", zipfile.ZIP_DEFLATED) as z:
                  z.write(src, target)
          print("已打包:", zpath)
          PY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
          generate_release_notes: true
