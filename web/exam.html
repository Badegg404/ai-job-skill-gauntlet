<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 技能考核中心 · AI Job Skill Gauntlet</title>
  <link rel="stylesheet" href="style.css?v=20260819">
</head>
<body class="exam-body">
  <canvas id="neural-bg"></canvas>
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>
  <div id="particle-layer"></div>
  <div class="combo-banner" id="combo-banner"></div>

  <!-- 常驻左侧导航（UI 优化：图标+文字，当前项霓虹高亮） -->
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="exam-wrap">
    <!-- 顶栏：终端 HUD 风格 -->
    <header class="exam-topbar">
      <div class="exam-logo"><span class="logo-cursor">&gt;_</span><svg class="logo-title" width="204" height="30" viewBox="0 0 204 30" aria-label="AI 技能考核中心"><defs><linearGradient id="lg-title" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ff3df0;#b026ff;#00e5ff" dur="2s" begin="indefinite" repeatCount="1"/></stop><stop offset="34%" stop-color="#ff3df0"><animate attributeName="stop-color" values="#ff3df0;#b026ff;#00e5ff;#ff3df0" dur="2s" begin="indefinite" repeatCount="1"/></stop><stop offset="67%" stop-color="#b026ff"><animate attributeName="stop-color" values="#b026ff;#00e5ff;#ff3df0;#b026ff" dur="2s" begin="indefinite" repeatCount="1"/></stop><stop offset="100%" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#ff3df0;#b026ff;#00e5ff" dur="2s" begin="indefinite" repeatCount="1"/></stop></linearGradient></defs><text x="0" y="23" fill="url(#lg-title)" font-size="22" font-weight="700" font-family="Orbitron, 'Smiley Sans', 'PingFang SC', sans-serif" letter-spacing="2">AI 技能考核中心</text></svg><span class="logo-ai">[AI-EXAM]</span></div>
      <div class="exam-gamestat">
        <div class="gs-item"><div class="gs-level" id="gs-level">1</div><div class="gs-label" id="gs-title">🌱 见习学徒</div></div>
        <div class="gs-item"><div class="gs-num" id="gs-xp">0</div><div class="gs-label">XP</div></div>
        <div class="gs-item"><div class="gs-num" id="gs-ap">0</div><div class="gs-label">AP</div></div>
        <div class="gs-item"><div class="gs-num" id="gs-streak">0</div><div class="gs-label">STREAK</div></div>
        <div class="gs-item"><div class="gs-num" id="gs-badges">0</div><div class="gs-label">BADGES</div></div>
        <div class="gs-item"><div class="gs-num" id="gs-exams">0</div><div class="gs-label">RUNS</div></div>
      </div>
    </header>

    <!-- 视图容器 -->
    <main id="exam-view"></main>
  </div>

  <script src="neural.js?v=20260819"></script>

  <script src="schema.js?v=20260819"></script>
  <script src="prompts.js?v=20260819"></script>
  <script src="scoring.js?v=20260819"></script>
  <script src="profile.js?v=20260819"></script>
  <script src="exam.js?v=20260819"></script>
